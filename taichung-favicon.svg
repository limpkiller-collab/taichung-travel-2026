<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 타이중 : 야시장 홍등 (그라데이션 스타일) -->
  <defs>
    <linearGradient id="g" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="55%" stop-color="#8F7BF3"/>
      <stop offset="100%" stop-color="#C9A8F7"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#7B8CF0" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#EEEEF2" stroke-width="3"/>
  <g filter="url(#soft)">
    <!-- 걸이 -->
    <path d="M256 66 L256 96" stroke="url(#g)" stroke-width="16" stroke-linecap="round"/>
    <!-- 위 캡 -->
    <rect x="206" y="96" width="100" height="34" rx="14" fill="url(#g)"/>
    <!-- 몸통 -->
    <ellipse cx="256" cy="262" rx="150" ry="140" fill="url(#g)"/>
    <!-- 갓살(밝은 세로줄) -->
    <path d="M196 148 C 176 220, 176 304, 196 376 M316 148 C 336 220, 336 304, 316 376 M256 132 L256 392"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="12" stroke-linecap="round"/>
    <!-- 아래 캡 + 술 -->
    <rect x="212" y="386" width="88" height="30" rx="13" fill="url(#g)"/>
    <path d="M256 416 L256 448" stroke="url(#g)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="256" cy="458" r="10" fill="url(#g)"/>
  </g>
</svg>
